[project]
name = "data-platform-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lambert-19", email = "ndawseri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[project.scripts]
data-platform-project = "data_platform_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pyright]
# Synapse notebooks run on the Spark pool, where spark, sc, display, delta and the
# transform module (loaded with sc.addPyFile) exist; they cannot be resolved locally.
ignore = ["synapse/notebooks"]
